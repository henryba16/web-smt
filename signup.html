<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <a class="brand" href="index.html"><span class="brand-mark">C</span><span>Classroom AI</span></a>
        </header>

        <main>
            <div class="signup-box">
                <p class="eyebrow">Teacher workspace</p><h2>Create your account</h2>
                <form>
                    <label for="signup-email">Email address</label><input id="signup-email" type="email" name="usermail" placeholder="you@school.edu" autocomplete="email" required>
                    <label for="signup-password">Password</label><input id="signup-password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>

                    <button type="submit">Create account</button>
                    <a href="signin.html">Already have an account? Sign in</a>
                </form>
            </div>
        </main>
        
        <script type="module" src="js/signup.js"></script>
    </body>
</html>
