<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign In</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <a class="brand" href="index.html"><span class="brand-mark">C</span><span>Classroom AI</span></a>
        </header>

        <main>
            <div class="signin-box">
                <p class="eyebrow">Teacher workspace</p><h2>Welcome back</h2>
                <form>
                    <label for="signin-email">Email address</label><input id="signin-email" type="email" name="usermail" placeholder="you@school.edu" autocomplete="email" required>
                    <label for="signin-password">Password</label><input id="signin-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

                    <button type="submit">Sign in</button>
                    <a href="signup.html">New to Classroom AI? Create an account</a>
                </form>
            </div>
        </main>

        <script type="module" src="js/signin.js"></script>
    </body>
</html>
